<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>服装详情</title>
  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body class="item-page">
  <!-- 顶部状态栏 -->
  <div class="item-header" id="itemHeader">
    <span class="item-id-badge" id="itemIdBadge"></span>
    <span class="item-status-badge" id="itemStatusBadge"></span>
  </div>

  <!-- 搭配图轮播区 -->
  <div class="item-gallery" id="itemGallery">
    <div class="gallery-main" id="galleryMain">
      <img id="galleryImg" src="" alt="搭配图" />
    </div>
    <div class="gallery-dots" id="galleryDots"></div>
  </div>

  <!-- 衣服信息 -->
  <div class="item-info">
    <h2 class="item-name" id="itemName"></h2>
    <div class="item-meta">
      <span class="meta-tag" id="itemStyle"></span>
      <span class="meta-tag" id="itemCategory"></span>
      <span class="meta-tag meta-price" id="itemPrice"></span>
    </div>
    <p class="item-styling" id="itemStyling"></p>
  </div>

  <!-- 操作按钮区 -->
  <div class="item-actions" id="itemActions">
    <!-- 动态渲染 -->
  </div>

  <!-- 弹窗遮罩 -->
  <div class="modal-overlay" id="modalOverlay" style="display:none">
    <div class="modal-sheet" id="modalSheet"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" style="display:none"></div>

</body>
